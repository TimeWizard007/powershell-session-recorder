name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Ubuntu build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull request or main commit
        uses: actions/checkout@v7.0.1

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Debug build
        run: dotnet build -c Debug --nologo

      - name: Debug tests
        run: dotnet test -c Debug --no-build --nologo

      - name: Release build
        run: dotnet build -c Release --nologo

      - name: Release tests
        run: dotnet test -c Release --no-build --nologo

  windows:
    name: Windows build and tests
    runs-on: windows-2022
    steps:
      - name: Check out the pull request or main commit
        uses: actions/checkout@v7.0.1

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Debug build
        run: dotnet build -c Debug --nologo

      - name: Debug tests
        run: dotnet test -c Debug --no-build --nologo

      - name: Release build
        run: dotnet build -c Release --nologo

      - name: Release tests
        run: dotnet test -c Release --no-build --nologo

  macos:
    name: macOS build, tests, and packages
    runs-on: macos-15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the pull request or main commit
        uses: actions/checkout@v7.0.1

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Debug build
        run: dotnet build -c Debug --nologo

      - name: Debug tests
        run: dotnet test -c Debug --no-build --nologo

      - name: Release build
        run: dotnet build -c Release --nologo

      - name: Release tests
        run: dotnet test -c Release --no-build --nologo

      - name: Package, ad-hoc sign, and verify Intel and Apple Silicon images
        run: sh packaging/macos/build-dmg.sh all

      - name: Verify package checksums
        run: sh packaging/ci/verify-checksum-files.sh artifacts 4

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: powershell-session-recorder-macos-ci
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/PowerShellSessionRecorder-*-osx-x64.dmg
            artifacts/PowerShellSessionRecorder-*-osx-x64.dmg.sha256
            artifacts/PowerShellSessionRecorder-*-osx-x64.zip
            artifacts/PowerShellSessionRecorder-*-osx-x64.zip.sha256
            artifacts/PowerShellSessionRecorder-*-osx-arm64.dmg
            artifacts/PowerShellSessionRecorder-*-osx-arm64.dmg.sha256
            artifacts/PowerShellSessionRecorder-*-osx-arm64.zip
            artifacts/PowerShellSessionRecorder-*-osx-arm64.zip.sha256
